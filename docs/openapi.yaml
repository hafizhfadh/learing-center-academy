openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'https://api.learning-center-academy.local'
tags:
  -
    name: Authentication
    description: "\nEndpoints for user login, token refresh, profile, institution info and logout."
  -
    name: Courses
    description: "\nEndpoints for browsing, searching and viewing course details."
  -
    name: 'Learning Paths'
    description: "\nEndpoints for browsing learning paths, viewing details, enrolling and tracking progress."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Protected endpoints require an Authorization: Bearer token. Obtain the token from the POST /login endpoint.'
security:
  -
    default: []
paths:
  /login:
    post:
      summary: 'User login'
      operationId: userLogin
      description: "Authenticate a user with email and password and issue a JWT access token.\nReturns a JWT bearer token containing user and client claims."
      parameters: []
      responses:
        200:
          description: 'Successful login'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Login successful'
                  data:
                    user:
                      id: 1
                      name: 'Super User'
                      email: admin@learningcenter.com
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    token_type: Bearer
                    expires_in: 3600
                  pagination: {  }
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Login successful'
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1
                          name:
                            type: string
                            example: 'Super User'
                          email:
                            type: string
                            example: admin@learningcenter.com
                      token:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 3600
                  pagination:
                    type: object
                    properties: {  }
        401:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: 'Invalid credentials'
                    type: object
                    example:
                      code: 401
                      message: 'The provided credentials do not match our records'
                      data: []
                      pagination: {  }
                    properties:
                      code:
                        type: integer
                        example: 401
                      message:
                        type: string
                        example: 'The provided credentials do not match our records'
                      data:
                        type: array
                        example: []
                      pagination:
                        type: object
                        properties: {  }
                  -
                    description: 'Unauthorized Client'
                    type: object
                    example:
                      code: 401
                      message: 'Unauthorized Client'
                      data: []
                      pagination: {  }
                    properties:
                      code:
                        type: integer
                        example: 401
                      message:
                        type: string
                        example: 'Unauthorized Client'
                      data:
                        type: array
                        example: []
                      pagination:
                        type: object
                        properties: {  }
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 422
                  message: 'Validation failed'
                  data:
                    errors:
                      email:
                        - 'The email field is required.'
                      password:
                        - 'The password field is required.'
                  pagination: {  }
                properties:
                  code:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'Validation failed'
                  data:
                    type: object
                    properties:
                      errors:
                        type: object
                        properties:
                          email:
                            type: array
                            example:
                              - 'The email field is required.'
                            items:
                              type: string
                          password:
                            type: array
                            example:
                              - 'The password field is required.'
                            items:
                              type: string
                  pagination:
                    type: object
                    properties: {  }
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: "The user's email address."
                  example: admin@learningcenter.com
                password:
                  type: string
                  description: "The user's password."
                  example: password
              required:
                - email
                - password
      security: []
  /refresh:
    post:
      summary: 'Refresh auth token'
      operationId: refreshAuthToken
      description: 'Refresh the current JWT token.'
      parameters: []
      responses:
        200:
          description: 'Token refreshed'
          content:
            text/plain:
              schema:
                type: string
                example: "{\n  \"code\": 200,\n  \"message\": \"Token refreshed successfully\",\n  \"data\": {\n    \"user\": { ... },\n    \"token\": \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...\",\n    \"token_type\": \"Bearer\",\n    \"expires_in\": 3600\n  },\n  \"pagination\": {}\n}"
      tags:
        - Authentication
  /logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Invalidate the current JWT token.'
      parameters: []
      responses: {  }
      tags:
        - Authentication
  /me:
    post:
      summary: 'Get current user (Me)'
      operationId: getCurrentUserMe
      description: 'Get the authenticated User.'
      parameters: []
      responses: {  }
      tags:
        - Authentication
  /profile:
    get:
      summary: 'Get current user profile'
      operationId: getCurrentUserProfile
      description: 'Alias for me() but strictly follows the profile response structure if needed.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Authentication
  /institution:
    get:
      summary: 'Get institution information'
      operationId: getInstitutionInformation
      description: "Retrieve the institution associated with the authenticated user.\nOnly users with institution-bound roles can access this endpoint."
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Authentication
  /courses:
    get:
      summary: 'List courses'
      operationId: listCourses
      description: "Return a paginated list of courses accessible to the current user.\nStudents only see published courses; staff can see all."
      parameters:
        -
          in: query
          name: page
          description: 'The page number to return.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'The page number to return.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Number of items per page (1-100).'
          example: 20
          required: false
          schema:
            type: integer
            description: 'Number of items per page (1-100).'
            example: 20
        -
          in: query
          name: sort
          description: 'Field to sort by: title, created_at, estimated_time.'
          example: '"created_at"'
          required: false
          schema:
            type: string
            description: 'Field to sort by: title, created_at, estimated_time.'
            example: '"created_at"'
        -
          in: query
          name: order
          description: 'Sort direction: asc or desc.'
          example: '"desc"'
          required: false
          schema:
            type: string
            description: 'Sort direction: asc or desc.'
            example: '"desc"'
      responses:
        200:
          description: 'Courses retrieved'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Courses retrieved successfully'
                  data:
                    -
                      id: 1
                      title: 'Intro to Programming'
                      slug: intro-to-programming
                      description: 'Learn the basics of programming.'
                      banner_url: 'https://example.com/banners/intro-to-programming.png'
                      tags:
                        - programming
                        - beginner
                      estimated_time: 3600
                      is_published: true
                      created_at: '2024-01-01T12:00:00Z'
                      instructor:
                        id: 10
                        name: 'Jane Doe'
                        email: jane@example.com
                      enrollment_status: not_enrolled
                      total_lessons: 10
                      total_tasks: 5
                  pagination:
                    current_page: 1
                    per_page: 20
                    total: 35
                    last_page: 2
                    from: 1
                    to: 20
                    has_more_pages: true
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Courses retrieved successfully'
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        title: 'Intro to Programming'
                        slug: intro-to-programming
                        description: 'Learn the basics of programming.'
                        banner_url: 'https://example.com/banners/intro-to-programming.png'
                        tags:
                          - programming
                          - beginner
                        estimated_time: 3600
                        is_published: true
                        created_at: '2024-01-01T12:00:00Z'
                        instructor:
                          id: 10
                          name: 'Jane Doe'
                          email: jane@example.com
                        enrollment_status: not_enrolled
                        total_lessons: 10
                        total_tasks: 5
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        title:
                          type: string
                          example: 'Intro to Programming'
                        slug:
                          type: string
                          example: intro-to-programming
                        description:
                          type: string
                          example: 'Learn the basics of programming.'
                        banner_url:
                          type: string
                          example: 'https://example.com/banners/intro-to-programming.png'
                        tags:
                          type: array
                          example:
                            - programming
                            - beginner
                          items:
                            type: string
                        estimated_time:
                          type: integer
                          example: 3600
                        is_published:
                          type: boolean
                          example: true
                        created_at:
                          type: string
                          example: '2024-01-01T12:00:00Z'
                        instructor:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 10
                            name:
                              type: string
                              example: 'Jane Doe'
                            email:
                              type: string
                              example: jane@example.com
                        enrollment_status:
                          type: string
                          example: not_enrolled
                        total_lessons:
                          type: integer
                          example: 10
                        total_tasks:
                          type: integer
                          example: 5
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 35
                      last_page:
                        type: integer
                        example: 2
                      from:
                        type: integer
                        example: 1
                      to:
                        type: integer
                        example: 20
                      has_more_pages:
                        type: boolean
                        example: true
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 422
                  message: 'Validation failed'
                  data:
                    errors:
                      page:
                        - 'The page must be at least 1.'
                  pagination: {  }
                properties:
                  code:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'Validation failed'
                  data:
                    type: object
                    properties:
                      errors:
                        type: object
                        properties:
                          page:
                            type: array
                            example:
                              - 'The page must be at least 1.'
                            items:
                              type: string
                  pagination:
                    type: object
                    properties: {  }
      tags:
        - Courses
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 22
                sort:
                  type: string
                  description: ''
                  example: title
                  enum:
                    - title
                    - created_at
                    - estimated_time
                order:
                  type: string
                  description: ''
                  example: asc
                  enum:
                    - asc
                    - desc
  /courses/search:
    get:
      summary: 'Search courses'
      operationId: searchCourses
      description: "Search courses by title, description, tags, instructor and date/time filters.\nSupports relevance-based sorting when a search query is provided."
      parameters:
        -
          in: query
          name: q
          description: 'Search term used to match title, description or tags.'
          example: '"programming"'
          required: false
          schema:
            type: string
            description: 'Search term used to match title, description or tags.'
            example: '"programming"'
        -
          in: query
          name: instructor
          description: 'Filter by instructor name.'
          example: '"Jane Doe"'
          required: false
          schema:
            type: string
            description: 'Filter by instructor name.'
            example: '"Jane Doe"'
        -
          in: query
          name: tags
          description: 'Comma-separated list of tags to filter by.'
          example: '"beginner,backend"'
          required: false
          schema:
            type: string
            description: 'Comma-separated list of tags to filter by.'
            example: '"beginner,backend"'
        -
          in: query
          name: start_date
          description: 'Filter courses created on or after this date (Y-m-d).'
          example: '"2024-01-01"'
          required: false
          schema:
            type: string
            description: 'Filter courses created on or after this date (Y-m-d).'
            example: '"2024-01-01"'
        -
          in: query
          name: end_date
          description: 'Filter courses created on or before this date (Y-m-d).'
          example: '"2024-12-31"'
          required: false
          schema:
            type: string
            description: 'Filter courses created on or before this date (Y-m-d).'
            example: '"2024-12-31"'
        -
          in: query
          name: min_time
          description: 'Minimum estimated time in minutes.'
          example: 30
          required: false
          schema:
            type: integer
            description: 'Minimum estimated time in minutes.'
            example: 30
        -
          in: query
          name: max_time
          description: 'Maximum estimated time in minutes.'
          example: 120
          required: false
          schema:
            type: integer
            description: 'Maximum estimated time in minutes.'
            example: 120
        -
          in: query
          name: page
          description: 'The page number to return.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'The page number to return.'
            example: 1
        -
          in: query
          name: per_page
          description: 'Number of items per page (1-100).'
          example: 20
          required: false
          schema:
            type: integer
            description: 'Number of items per page (1-100).'
            example: 20
        -
          in: query
          name: sort
          description: 'Sort field: title, created_at, estimated_time, relevance.'
          example: '"relevance"'
          required: false
          schema:
            type: string
            description: 'Sort field: title, created_at, estimated_time, relevance.'
            example: '"relevance"'
        -
          in: query
          name: order
          description: 'Sort direction: asc or desc.'
          example: '"desc"'
          required: false
          schema:
            type: string
            description: 'Sort direction: asc or desc.'
            example: '"desc"'
      responses:
        200:
          description: 'Search completed'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 200
                  message: 'Search completed successfully'
                  data:
                    -
                      id: 1
                      title: 'Intro to Programming'
                      slug: intro-to-programming
                      description: 'Learn the basics of programming.'
                      banner_url: 'https://example.com/banners/intro-to-programming.png'
                      tags:
                        - programming
                        - beginner
                      estimated_time: 3600
                      is_published: true
                      created_at: '2024-01-01T12:00:00Z'
                      instructor:
                        id: 10
                        name: 'Jane Doe'
                        email: jane@example.com
                      enrollment_status: not_enrolled
                      total_lessons: 10
                      total_tasks: 5
                      relevance_score: 1
                  pagination:
                    current_page: 1
                    per_page: 20
                    total: 10
                    last_page: 1
                    from: 1
                    to: 10
                    has_more_pages: false
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: 'Search completed successfully'
                  data:
                    type: array
                    example:
                      -
                        id: 1
                        title: 'Intro to Programming'
                        slug: intro-to-programming
                        description: 'Learn the basics of programming.'
                        banner_url: 'https://example.com/banners/intro-to-programming.png'
                        tags:
                          - programming
                          - beginner
                        estimated_time: 3600
                        is_published: true
                        created_at: '2024-01-01T12:00:00Z'
                        instructor:
                          id: 10
                          name: 'Jane Doe'
                          email: jane@example.com
                        enrollment_status: not_enrolled
                        total_lessons: 10
                        total_tasks: 5
                        relevance_score: 1
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        title:
                          type: string
                          example: 'Intro to Programming'
                        slug:
                          type: string
                          example: intro-to-programming
                        description:
                          type: string
                          example: 'Learn the basics of programming.'
                        banner_url:
                          type: string
                          example: 'https://example.com/banners/intro-to-programming.png'
                        tags:
                          type: array
                          example:
                            - programming
                            - beginner
                          items:
                            type: string
                        estimated_time:
                          type: integer
                          example: 3600
                        is_published:
                          type: boolean
                          example: true
                        created_at:
                          type: string
                          example: '2024-01-01T12:00:00Z'
                        instructor:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 10
                            name:
                              type: string
                              example: 'Jane Doe'
                            email:
                              type: string
                              example: jane@example.com
                        enrollment_status:
                          type: string
                          example: not_enrolled
                        total_lessons:
                          type: integer
                          example: 10
                        total_tasks:
                          type: integer
                          example: 5
                        relevance_score:
                          type: integer
                          example: 1
                  pagination:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      per_page:
                        type: integer
                        example: 20
                      total:
                        type: integer
                        example: 10
                      last_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      to:
                        type: integer
                        example: 10
                      has_more_pages:
                        type: boolean
                        example: false
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  code: 422
                  message: 'Validation failed'
                  data:
                    errors:
                      start_date:
                        - 'The start date does not match the format Y-m-d.'
                  pagination: {  }
                properties:
                  code:
                    type: integer
                    example: 422
                  message:
                    type: string
                    example: 'Validation failed'
                  data:
                    type: object
                    properties:
                      errors:
                        type: object
                        properties:
                          start_date:
                            type: array
                            example:
                              - 'The start date does not match the format Y-m-d.'
                            items:
                              type: string
                  pagination:
                    type: object
                    properties: {  }
      tags:
        - Courses
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                instructor:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                tags:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                start_date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>.'
                  example: '2026-01-30'
                end_date:
                  type: string
                  description: 'Must be a valid date in the format <code>Y-m-d</code>. Must be a date after or equal to <code>start_date</code>.'
                  example: '2052-02-23'
                min_time:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 39
                max_time:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 84
                page:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 17
                sort:
                  type: string
                  description: ''
                  example: created_at
                  enum:
                    - title
                    - created_at
                    - estimated_time
                    - relevance
                order:
                  type: string
                  description: ''
                  example: desc
                  enum:
                    - asc
                    - desc
